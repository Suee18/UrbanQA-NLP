# Germany RAG — configuration
# Everything tunable in one place. Loaded by rag/config.py.

# German cities / locations to ingest. Chunks are tagged with their location
# (this is the "chunk by city/location" requirement). One Wikipedia article
# per entry. Add or remove freely, then re-run build_index.
locations:
  - Berlin
  - Munich
  - Hamburg
  - Cologne
  - Frankfurt
  - Stuttgart
  - Düsseldorf
  - Leipzig
  - Dresden
  - Hanover
  - Nuremberg
  - Bremen

# ── Ingestion / chunking ────────────────────────────────────────────────
ingest:
  lang: en                 # Wikipedia language edition
  max_docs_per_location: 1 # how many articles WikipediaLoader returns per query
  chunk_size: 800          # characters per chunk
  chunk_overlap: 0         # INSTRUCTOR CONSTRAINT: no overlap. Do not change
                           # without asking the user first.

# ── Embeddings (BAAI BGE via sentence-transformers) ─────────────────────
embeddings:
  model: BAAI/bge-large-en-v1.5
  dim: 1024                # bge-large-en-v1.5 output dimension
  # BGE retrieval works best when the QUERY is prefixed with this instruction;
  # passages are embedded with no prefix.
  query_instruction: "Represent this sentence for searching relevant passages: "
  normalize: true          # cosine similarity via normalized vectors

# ── Qdrant (single collection) ──────────────────────────────────────────
qdrant:
  collection: germany_rag  # ONE collection only (instructor constraint)
  distance: Cosine
  # URL + API key are read from .env (QDRANT_URL, QDRANT_API_KEY).

# ── Retrieval ────────────────────────────────────────────────────────────
retrieval:
  top_k: 10                # instructor: not more than 10-15

# ── Generation (LLM nodes: rewrite + final answer) ──────────────────────
generator:
  backend: groq            # "local" (Qwen2.5 on GPU) | "groq" (free cloud) | "api" (Claude)
  temperature: 0.1
  max_tokens: 512
  local:
    model: Qwen/Qwen2.5-3B-Instruct   # fits an 8GB GPU; bump to 7B if you have VRAM
  groq:
    model: llama-3.3-70b-versatile    # free + fast; needs GROQ_API_KEY in .env
  api:
    model: claude-sonnet-4-5          # used only when backend == "api"
    # ANTHROPIC_API_KEY read from .env
